name: Graphics Tests

on:
  push:
    branches: [ master, 'robolectric-*.x' ]
    paths-ignore:
      - '**.md'

  pull_request:
    # Do not add `paths-ignore` here, this is required to be run on every PR for the `google` branch.
    branches: [ master, google ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  graphics_tests:
    strategy:
      fail-fast: false
      matrix:
        device: [
          macos-26-intel, # Tests Mac x86_64
          macos-latest, # Tests Mac arm64
          ubuntu-latest, # Tests Linux x86_64
          windows-latest, # Tests Windows x86_64
        ]

    name: Graphics Tests
    runs-on: ${{ matrix.device }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Remove compromised eMudhra certificates from preinstalled CA bundles.
      # See https://github.com/curl/curl/blob/master/.github/actions/macos-fix-certs/action.yml.
      - name: Fix macOS CA root bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ls -lA /etc/ssl/cert.pem
          t="$(mktemp)" && \
            awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
            awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1' \
              '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
            [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          ls -lA /etc/ssl/cert.pem

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version-file: .github/.java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        env:
          SKIP_ERRORPRONE: true
          SKIP_JAVADOC: true
        run: >
          ./gradlew
          :integration_tests:nativegraphics:testDebugUnitTest
          :integration_tests:roborazzi:verifyRoborazziDebug
          --stacktrace --continue
          "-Drobolectric.alwaysIncludeVariantMarkersInTestName=true"

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test_results_${{ matrix.device }}
          path: |
            **/build/test-results/**/TEST-*.xml
            **/roborazzi/build/reports/*
            **/roborazzi/src/screenshots/*
            **/roborazzi/build/outputs/roborazzi/*
